<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagem e PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 { margin-top: 0; color: #333; }
        button {
            margin: 10px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 6px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }

        .loading {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        .drag-area {
            border: 3px dashed #007bff;
            padding: 30px;
            margin: 15px 0;
            background-color: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .drag-area.dragover { background-color: #e3f2fd; border-color: #0056b3; }

        .file-list {
            margin-top: 15px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .file-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-file {
            color: #d32f2f;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        #upscaleOptions, #mergeOptions { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor de Imagem e PDF</h1>
        <p>Escolha uma opção:</p>

        <button onclick="selectConversion('imageToPdf')">Imagem → PDF</button>
        <button onclick="selectConversion('pdfToImage')">PDF → Imagens</button>
        <button onclick="selectConversion('upscaleImage')">Aprimorar Imagem</button>
        <button onclick="selectConversion('upscalePdf')">Aprimorar PDF</button>
        <button onclick="selectConversion('mergeFiles')">Juntar Arquivos em PDF</button>

        <!-- Loading universal -->
        <div class="loading" id="globalLoading">Carregando... Por favor, aguarde.</div>

        <!-- Inputs ocultos -->
        <input type="file" id="fileInput" onchange="handleFileUpload()">
        <input type="file" id="upscaleFileInput" onchange="handleUpscaleUpload()">
        <input type="file" id="mergeFileInput" multiple onchange="handleMergeFiles()" accept=".pdf,image/*">

        <!-- Opções de upscale -->
        <div id="upscaleOptions">
            <label for="scaleFactor"><strong>Fator de aprimoramento:</strong></label>
            <select id="scaleFactor">
                <option value="2">2× (Rápido)</option>
                <option value="4" selected>4× (Ótimo equilíbrio)</option>
                <option value="8">8× (Máxima qualidade)</option>
            </select>
            <div id="dragArea" class="drag-area">
                <p>Arraste o arquivo aqui ou</p>
                <button onclick="document.getElementById('upscaleFileInput').click()">Selecionar arquivo</button>
            </div>
        </div>

        <!-- Opções de juntar arquivos -->
        <div id="mergeOptions">
            <div id="mergeDragArea" class="drag-area">
                <p>Arraste PDFs e imagens aqui ou</p>
                <button onclick="document.getElementById('mergeFileInput').click()">Selecionar arquivos</button>
            </div>
            <div id="fileList" class="file-list"></div>
            <button id="mergeButton" onclick="mergeSelectedFiles()">Juntar e Baixar PDF</button>
        </div>
    </div>

    <script>
        let conversionType = null;
        const MAX_CANVAS_PIXELS = 16777216;
        let mergeFiles = [];

        // Mostra/oculta loading global
        function showLoading(show = true) {
            document.getElementById('globalLoading').style.display = show ? 'block' : 'none';
            document.querySelectorAll('button').forEach(b => b.disabled = show);
        }

        function selectConversion(type) {
            conversionType = type;
            document.getElementById('upscaleOptions').style.display = 'none';
            document.getElementById('mergeOptions').style.display = 'none';

            if (type === 'imageToPdf') {
                document.getElementById('fileInput').accept = 'image/*';
                document.getElementById('fileInput').click();
            } else if (type === 'pdfToImage') {
                document.getElementById('fileInput').accept = 'application/pdf';
                document.getElementById('fileInput').click();
            } else if (type === 'upscaleImage') {
                document.getElementById('upscaleOptions').style.display = 'block';
                document.getElementById('upscaleFileInput').accept = 'image/*';
            } else if (type === 'upscalePdf') {
                document.getElementById('upscaleOptions').style.display = 'block';
                document.getElementById('upscaleFileInput').accept = 'application/pdf';
            } else if (type === 'mergeFiles') {
                document.getElementById('mergeOptions').style.display = 'block';
                mergeFiles = [];
                updateFileList();
            }
        }

        // Drag & drop para upscale
        ['dragArea', 'mergeDragArea'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
            el.addEventListener('dragleave', () => el.classList.remove('dragover'));
            el.addEventListener('drop', e => {
                e.preventDefault();
                el.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files);
                if (id === 'dragArea') {
                    if (files[0]) {
                        const dt = new DataTransfer();
                        dt.items.add(files[0]);
                        document.getElementById('upscaleFileInput').files = dt.files;
                        handleUpscaleUpload();
                    }
                } else {
                    addMergeFiles(files);
                }
            });
        });

        function handleFileUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const name = file.name.split('.').slice(0, -1).join('.');

            showLoading(true);
            if (conversionType === 'imageToPdf') convertImageToPdf(file, name);
            if (conversionType === 'pdfToImage') convertPdfToImage(file, name);
        }

        function handleUpscaleUpload() {
            const file = document.getElementById('upscaleFileInput').files[0];
            if (!file) return;
            const name = file.name.split('.').slice(0, -1).join('.');
            const factor = parseInt(document.getElementById('scaleFactor').value);

            showLoading(true);
            if (conversionType === 'upscaleImage') upscaleImage(file, name, factor);
            if (conversionType === 'upscalePdf') upscalePdf(file, name, factor);
        }

        function handleMergeFiles() {
            addMergeFiles(Array.from(document.getElementById('mergeFileInput').files));
        }

        function addMergeFiles(newFiles) {
            const valid = newFiles.filter(f => ['application/pdf','image/png','image/jpeg','image/jpg','image/webp'].includes(f.type));
            mergeFiles = mergeFiles.concat(valid);
            updateFileList();
        }

        function updateFileList() {
            const list = document.getElementById('fileList');
            const btn = document.getElementById('mergeButton');
            if (mergeFiles.length === 0) {
                list.innerHTML = '';
                btn.style.display = 'none';
                return;
            }
            list.innerHTML = mergeFiles.map((f, i) => `
                <div class="file-item">
                    <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                    <span class="remove-file" onclick="mergeFiles.splice(${i},1); updateFileList();">×</span>
                </div>
            `).join('');
            btn.style.display = 'inline-block';
        }

        // ==================== JUNÇÃO COM QUALIDADE + MESMA LARGURA SEM FAIXA BRANCA ====================
        async function mergeSelectedFiles() {
            if (mergeFiles.length === 0) return;
            showLoading(true);

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();
                let maxWidth = 0;
                const pagesToAdd = [];

                // 1ª passada: coleta páginas e calcula largura máxima
                for (const file of mergeFiles) {
                    if (file.type === 'application/pdf') {
                        const buf = await file.arrayBuffer();
                        const src = await PDFLib.PDFDocument.load(buf);
                        for (const page of src.getPages()) {
                            maxWidth = Math.max(maxWidth, page.getWidth());
                            pagesToAdd.push({ type: 'pdf', page, srcPdf: src });
                        }
                    } else {
                        const buf = await file.arrayBuffer();
                        const img = file.type.includes('jpeg') || file.type.includes('jpg')
                            ? await pdfDoc.embedJpg(buf)
                            : await pdfDoc.embedPng(buf);
                        const { width, height } = img.scale(1);
                        maxWidth = Math.max(maxWidth, width);
                        pagesToAdd.push({ type: 'image', img, width, height });
                    }
                }

                // 2ª passada: cria páginas com largura unificada e conteúdo escalado
                for (const item of pagesToAdd) {
                    const origWidth = item.type === 'pdf' ? item.page.getWidth() : item.width;
                    const origHeight = item.type === 'pdf' ? item.page.getHeight() : item.height;
                    const scale = maxWidth / origWidth;
                    const newHeight = origHeight * scale;

                    const page = pdfDoc.addPage([maxWidth, newHeight]);

                    if (item.type === 'pdf') {
                        const embedded = await pdfDoc.embedPage(item.page);
                        page.drawPage(embedded, { x: 0, y: 0, xScale: scale, yScale: scale });
                    } else {
                        page.drawImage(item.img, { x: 0, y: 0, width: maxWidth, height: newHeight });
                    }
                }

                const bytes = await pdfDoc.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'arquivos_juntos.pdf';
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Erro ao juntar arquivos: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        // ==================== CONVERSÃO IMAGEM → PDF ====================
        function convertImageToPdf(file, name) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: img.width > img.height ? 'l' : 'p',
                        unit: 'px',
                        format: [img.width, img.height]
                    });
                    pdf.addImage(e.target.result, 'PNG', 0, 0, img.width, img.height);
                    pdf.save(`${name}.pdf`);
                    showLoading(false);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==================== CONVERSÃO PDF → IMAGENS (CORRIGIDA) ====================
        async function convertPdfToImage(file, baseName) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const scale =  = 3; // Boa qualidade e velocidade
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');

                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const dataUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `${baseName}_página_${i}.png`;
                    link.href = dataUrl;
                    link.click();
                }
                showLoading(false);
            } catch (err) {
                alert('Erro ao converter PDF para imagens: ' + err.message);
                showLoading(false);
            }
        }

        // ==================== UPSCALE IMAGEM ====================
        function upscaleImage(file, name, factor) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const w = img.width * factor;
                    const h = img.height * factor;

                    if (w * h > MAX_CANVAS_PIXELS) {
                        alert('Imagem muito grande após upscale. Escolha fator menor.');
                        showLoading(false);
                        return;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    // Upscale em etapas para 8×
                    if (factor === 8) {
                        ctx.drawImage(img, 0, 0, w/2, h/2);
                        ctx.drawImage(canvas, 0, 0, w/2, h/2, 0, 0, w, h);
                    } else {
                        ctx.drawImage(img, 0, 0, w, h);
                    }

                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${name}_up.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showLoading(false);
                    }, 'image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==================== UPSCALE PDF (mantém texto selecionável) ====================
        async function upscalePdf(file, name, factor) {
            try {
                const buf = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(buf);
                const newPdf = await PDFLib.PDFDocument.create();

                for (const page of pdf.getPages()) {
                    const { width, height } = page.getSize();
                    const newPage = newPdf.addPage([width * factor, height * factor]);
                    const embedded = await newPdf.embedPage(page);
                    newPage.drawPage(embedded, {
                        x: 0, y: 0,
                        xScale: factor,
                        yScale: factor
                    });
                }

                const bytes = await newPdf.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name}_up.pdf`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Erro ao aprimorar PDF: ' + err.message);
            } finally {
                showLoading(false);
            }
        }
    </script>
</body>
</html>
