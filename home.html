<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagem e PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor de Imagem e PDF</h1>
        <p>Escolha uma opção:</p>
        <button onclick="selectConversion('imageToPdf')">Converter Imagem para PDF</button>
        <button onclick="selectConversion('pdfToImage')">Converter PDF para Imagem</button>
        <input type="file" id="fileInput" onchange="handleFileUpload()">
    </div>

    <script>
        let conversionType = null;

        function selectConversion(type) {
            conversionType = type;
            const fileInput = document.getElementById('fileInput');
            if (type === 'imageToPdf') {
                fileInput.accept = 'image/*';
            } else if (type === 'pdfToImage') {
                fileInput.accept = 'application/pdf';
            }
            fileInput.click();
        }

        function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            // Extrai o nome do arquivo sem a extensão
            const fileName = file.name.split('.').slice(0, -1).join('.');

            if (conversionType === 'imageToPdf') {
                convertImageToPdf(file, fileName);
            } else if (conversionType === 'pdfToImage') {
                convertPdfToImage(file, fileName);
            }
        }

        function convertImageToPdf(imageFile, fileName) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: img.width > img.height ? 'landscape' : 'portrait',
                        unit: 'px',
                        format: [img.width, img.height],
                        compress: false // Desativa compressão para máxima qualidade
                    });
                    pdf.addImage(img, 'PNG', 0, 0, img.width, img.height, '', 'NONE'); // Usa PNG e sem compressão
                    pdf.save(`${fileName}.pdf`);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(imageFile);
        }

        async function convertPdfToImage(pdfFile, fileName) {
            const arrayBuffer = await pdfFile.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;

            // Para simplificar, convertemos apenas a primeira página para imagem
            const page = await pdf.getPage(1);
            const scale = 4; // Aumenta a resolução para máxima qualidade
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.createElement('canvas');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            const context = canvas.getContext('2d');

            // Configura o canvas para máxima qualidade
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';

            await page.render({ canvasContext: context, viewport: viewport }).promise;

            const link = document.createElement('a');
            link.download = `${fileName}.png`;
            link.href = canvas.toDataURL('image/png', 1.0); // Qualidade máxima para PNG
            link.click();
        }
    </script>
</body>
</html>
