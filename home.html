<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagem e PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #fileInput, #upscaleFileInput, #mergeFileInput {
            display: none;
        }
        select {
            margin: 10px;
            padding: 5px;
            font-size: 16px;
            border-radius: 4px;
        }
        #upscaleOptions, #mergeOptions {
            display: none;
            margin-top: 20px;
        }
        #upscaleFileButton, #mergeFileButton {
            margin-top: 10px;
        }
        .drag-area {
            border: 2px dashed #007bff;
            padding: 20px;
            margin: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .drag-area.dragover {
            background-color: #e0e0e0;
        }
        .drag-area p {
            margin: 0 0 10px 0;
            color: #333;
        }
        .file-list {
            margin-top: 10px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 4px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
        .remove-file {
            color: red;
            cursor: pointer;
            font-weight: bold;
        }
        .loading {
            display: none;
            margin: 15px 0;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor de Imagem e PDF</h1>
        <p>Escolha uma opção:</p>
        <button onclick="selectConversion('imageToPdf')">Converter Imagem para PDF</button>
        <button onclick="selectConversion('pdfToImage')">Converter PDF para Imagem</button>
        <button onclick="selectConversion('upscaleImage')">Aprimorar Imagem</button>
        <button onclick="selectConversion('upscalePdf')">Aprimorar PDF</button>
        <button onclick="selectConversion('mergeFiles')">Juntar Arquivos em PDF</button>

        <input type="file" id="fileInput" onchange="handleFileUpload()">
        <input type="file" id="upscaleFileInput" onchange="handleUpscaleUpload()">
        <input type="file" id="mergeFileInput" multiple onchange="handleMergeFiles()" accept=".pdf,image/*">

        <div id="upscaleOptions">
            <label for="scaleFactor">Escolha o fator de upscale:</label>
            <select id="scaleFactor">
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="8">8x</option>
            </select>
            <div id="dragArea" class="drag-area">
                <p>Arraste e solte o arquivo aqui ou</p>
                <button id="upscaleFileButton" onclick="document.getElementById('upscaleFileInput').click()">
                    Selecionar ou arrastar arquivo
                </button>
            </div>
        </div>

        <div id="mergeOptions">
            <div class="loading" id="mergeLoading">Carregando...</div>
            <div id="mergeDragArea" class="drag-area">
                <p>Arraste e solte os arquivos aqui (PDFs e imagens) ou</p>
                <button id="mergeFileButton" onclick="document.getElementById('mergeFileInput').click()">
                    Selecionar arquivos
                </button>
            </div>
            <div id="fileList" class="file-list" style="display: none;"></div>
            <button id="mergeButton" style="display: none; margin-top: 10px;" onclick="mergeSelectedFiles()">
                Juntar e Baixar PDF
            </button>
        </div>
    </div>

    <script>
        let conversionType = null;
        const MAX_CANVAS_PIXELS = 16777216;
        let mergeFiles = [];

        function selectConversion(type) {
            conversionType = type;
            const fileInput = document.getElementById('fileInput');
            const upscaleFileInput = document.getElementById('upscaleFileInput');
            const mergeFileInput = document.getElementById('mergeFileInput');
            const upscaleOptions = document.getElementById('upscaleOptions');
            const mergeOptions = document.getElementById('mergeOptions');
            const dragArea = document.getElementById('dragArea');
            const mergeDragArea = document.getElementById('mergeDragArea');

            // Hide all option panels
            upscaleOptions.style.display = 'none';
            mergeOptions.style.display = 'none';

            if (type === 'imageToPdf') {
                fileInput.accept = 'image/*';
                fileInput.click();
            } else if (type === 'pdfToImage') {
                fileInput.accept = 'application/pdf';
                fileInput.click();
            } else if (type === 'upscaleImage') {
                upscaleOptions.style.display = 'block';
                dragArea.style.display = 'block';
                upscaleFileInput.accept = 'image/*';
            } else if (type === 'upscalePdf') {
                upscaleOptions.style.display = 'block';
                dragArea.style.display = 'block';
                upscaleFileInput.accept = 'application/pdf';
            } else if (type === 'mergeFiles') {
                mergeOptions.style.display = 'block';
                mergeDragArea.style.display = 'block';
                mergeFiles = [];
                updateFileList();
            }
        }

        // Drag-and-drop for upscale
        const dragArea = document.getElementById('dragArea');
        dragArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragArea.classList.add('dragover');
        });
        dragArea.addEventListener('dragleave', () => {
            dragArea.classList.remove('dragover');
        });
        dragArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            const upscaleFileInput = document.getElementById('upscaleFileInput');
            const dt = new DataTransfer();
            dt.items.add(file);
            upscaleFileInput.files = dt.files;
            handleUpscaleUpload();
        });

        // Drag-and-drop for merge
        const mergeDragArea = document.getElementById('mergeDragArea');
        mergeDragArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            mergeDragArea.classList.add('dragover');
        });
        mergeDragArea.addEventListener('dragleave', () => {
            mergeDragArea.classList.remove('dragover');
        });
        mergeDragArea.addEventListener('drop', (e) => {
            e.preventDefault();
            mergeDragArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            addMergeFiles(files);
        });

        function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            const fileName = file.name.split('.').slice(0, -1).join('.');

            if (conversionType === 'imageToPdf') {
                convertImageToPdf(file, fileName);
            } else if (conversionType === 'pdfToImage') {
                convertPdfToImage(file, fileName);
            }
        }

        function handleUpscaleUpload() {
            const upscaleFileInput = document.getElementById('upscaleFileInput');
            const file = upscaleFileInput.files[0];
            if (!file) return;

            const fileName = file.name.split('.').slice(0, -1).join('.');
            const scaleFactor = parseInt(document.getElementById('scaleFactor').value);

            if (conversionType === 'upscaleImage') {
                upscaleImage(file, fileName, scaleFactor);
            } else if (conversionType === 'upscalePdf') {
                upscalePdf(file, fileName, scaleFactor);
            }
        }

        function handleMergeFiles() {
            const files = Array.from(document.getElementById('mergeFileInput').files);
            addMergeFiles(files);
        }

        function addMergeFiles(files) {
            const validTypes = ['application/pdf', 'image/png', 'image/jpeg', 'image/jpg', 'image/webp'];
            const newFiles = files.filter(file => validTypes.includes(file.type));
            mergeFiles = mergeFiles.concat(newFiles);
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const mergeButton = document.getElementById('mergeButton');
            if (mergeFiles.length === 0) {
                fileList.style.display = 'none';
                mergeButton.style.display = 'none';
                return;
            }

            fileList.innerHTML = '';
            mergeFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <span>${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                    <span class="remove-file" onclick="removeMergeFile(${index})">X</span>
                `;
                fileList.appendChild(div);
            });

            fileList.style.display = 'block';
            mergeButton.style.display = 'inline-block';
        }

        function removeMergeFile(index) {
            mergeFiles.splice(index, 1);
            updateFileList();
        }

        async function mergeSelectedFiles() {
            if (mergeFiles.length === 0) return;

            const loading = document.getElementById('mergeLoading');
            loading.style.display = 'block';

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    unit: 'px',
                    compress: false
                });

                let maxWidth = 0;
                const pageData = [];

                // First pass: determine maximum width and collect all pages
                for (const file of mergeFiles) {
                    if (file.type === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                        const pdfDoc = await loadingTask.promise;

                        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                            const page = await pdfDoc.getPage(pageNum);
                            const viewport = page.getViewport({ scale: 1 });
                            maxWidth = Math.max(maxWidth, viewport.width);
                            pageData.push({ type: 'pdf', page, viewport });
                        }
                    } else {
                        // Handle image
                        const imgData = await readFileAsDataURL(file);
                        const img = await loadImage(imgData);
                        maxWidth = Math.max(maxWidth, img.width);
                        pageData.push({ type: 'image', img, imgData });
                    }
                }

                // Second pass: render all pages with the same width (maxWidth)
                for (let i = 0; i < pageData.length; i++) {
                    const data = pageData[i];
                    const originalWidth = data.type === 'pdf' ? data.viewport.width : data.img.width;
                    const scale = maxWidth / originalWidth;
                    const targetHeight = data.type === 'pdf' 
                        ? data.viewport.height * scale 
                        : data.img.height * scale;

                    // Skip if canvas would be too large
                    if (maxWidth * targetHeight > MAX_CANVAS_PIXELS) {
                        alert(`Página muito grande para processar. Use arquivos menores ou menos páginas.`);
                        continue;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = maxWidth;
                    canvas.height = targetHeight;
                    const context = canvas.getContext('2d');
                    context.imageSmoothingEnabled = true;
                    context.imageSmoothingQuality = 'high';

                    if (data.type === 'pdf') {
                        const scaledViewport = data.page.getViewport({ scale: scale });
                        await data.page.render({ canvasContext: context, viewport: scaledViewport }).promise;
                    } else {
                        context.drawImage(data.img, 0, 0, maxWidth, targetHeight);
                    }

                    const imgData = canvas.toDataURL('image/jpeg', 0.95); // High quality JPEG

                    if (i > 0) {
                        pdf.addPage([maxWidth, targetHeight], maxWidth > targetHeight ? 'landscape' : 'portrait');
                    } else {
                        pdf.internal.pageSize.width = maxWidth;
                        pdf.internal.pageSize.height = targetHeight;
                    }
                    pdf.addImage(imgData, 'JPEG', 0, 0, maxWidth, targetHeight, '', 'FAST');
                }

                pdf.save('arquivos agrupados.pdf');
            } catch (error) {
                alert(`Erro ao processar arquivos: ${error.message}`);
            } finally {
                loading.style.display = 'none';
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function convertImageToPdf(imageFile, fileName) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: img.width > img.height ? 'landscape' : 'portrait',
                        unit: 'px',
                        format: [img.width, img.height],
                        compress: false
                    });
                    pdf.addImage(img, 'PNG', 0, 0, img.width, img.height, '', 'NONE');
                    pdf.save(`${fileName}.pdf`);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(imageFile);
        }

        async function convertPdfToImage(pdfFile, fileName) {
            try {
                const arrayBuffer = await pdfFile.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 4;
                    const viewport = page.getViewport({ scale: scale });
                    const canvas = document.createElement('canvas');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    const context = canvas.getContext('2d');

                    context.imageSmoothingEnabled = true;
                    context.imageSmoothingQuality = 'high';

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const link = document.createElement('a');
                    link.download = `${fileName}-${pageNum}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                }
            } catch (error) {
                alert('Erro ao converter PDF para imagem: ' + error.message);
            }
        }

        function upscaleImage(imageFile, fileName, scaleFactor) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    try {
                        const targetWidth = img.width * scaleFactor;
                        const targetHeight = img.height * scaleFactor;

                        if (targetWidth * targetHeight > MAX_CANVAS_PIXELS) {
                            alert(`Erro: A imagem escalada para ${scaleFactor}x é muito grande. Tente um fator menor ou uma imagem menor.`);
                            return;
                        }

                        let currentCanvas = document.createElement('canvas');
                        let currentContext = currentCanvas.getContext('2d');

                        if (scaleFactor === 8) {
                            currentCanvas.width = img.width * 4;
                            currentCanvas.height = img.height * 4;
                            currentContext.imageSmoothingEnabled = true;
                            currentContext.imageSmoothingQuality = 'high';
                            currentContext.drawImage(img, 0, 0, currentCanvas.width, currentCanvas.height);

                            const tempCanvas = currentCanvas;
                            currentCanvas = document.createElement('canvas');
                            currentCanvas.width = targetWidth;
                            currentCanvas.height = targetHeight;
                            currentContext = currentCanvas.getContext('2d');
                            currentContext.imageSmoothingEnabled = true;
                            currentContext.imageSmoothingQuality = 'high';
                            currentContext.drawImage(tempCanvas, 0, 0, currentCanvas.width, currentCanvas.height);
                        } else {
                            currentCanvas.width = targetWidth;
                            currentCanvas.height = targetHeight;
                            currentContext.imageSmoothingEnabled = true;
                            currentContext.imageSmoothingQuality = 'high';
                            currentContext.drawImage(img, 0, 0, currentCanvas.width, currentCanvas.height);
                        }

                        const link = document.createElement('a');
                        link.download = `${fileName}-up.png`;
                        link.href = currentCanvas.toDataURL('image/png', 1.0);
                        link.click();
                    } catch (error) {
                        alert('Erro ao realizar upscale da imagem: ' + error.message);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(imageFile);
        }

        async function upscalePdf(pdfFile, fileName, scaleFactor) {
            try {
                const arrayBuffer = await pdfFile.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;

                const { jsPDF } = window.jspdf;
                const newPdf = new jsPDF({
                    unit: 'px',
                    compress: false
                });

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const scaledViewport = page.getViewport({ scale: scaleFactor });

                    if (scaledViewport.width * scaledViewport.height > MAX_CANVAS_PIXELS) {
                        alert(`Erro: A página ${pageNum} escalada para ${scaleFactor}x é muito grande. Tente um fator menor.`);
                        return;
                    }

                    let currentCanvas = document.createElement('canvas');
                    let currentContext = currentCanvas.getContext('2d');

                    if (scaleFactor === 8) {
                        let tempViewport = page.getViewport({ scale: 4 });
                        currentCanvas.width = tempViewport.width;
                        currentCanvas.height = tempViewport.height;
                        currentContext.imageSmoothingEnabled = true;
                        currentContext.imageSmoothingQuality = 'high';
                        await page.render({ canvasContext: currentContext, viewport: tempViewport }).promise;

                        const tempCanvas = currentCanvas;
                        currentCanvas = document.createElement('canvas');
                        currentCanvas.width = scaledViewport.width;
                        currentCanvas.height = scaledViewport.height;
                        currentContext = currentCanvas.getContext('2d');
                        currentContext.imageSmoothingEnabled = true;
                        currentContext.imageSmoothingQuality = 'high';
                        currentContext.drawImage(tempCanvas, 0, 0, scaledViewport.width, scaledViewport.height);
                    } else {
                        currentCanvas.width = scaledViewport.width;
                        currentCanvas.height = scaledViewport.height;
                        currentContext.imageSmoothingEnabled = true;
                        currentContext.imageSmoothingQuality = 'high';
                        await page.render({ canvasContext: currentContext, viewport: scaledViewport }).promise;
                    }

                    if (pageNum > 1) {
                        newPdf.addPage([scaledViewport.width, scaledViewport.height], scaledViewport.width > scaledViewport.height ? 'landscape' : 'portrait');
                    } else {
                        newPdf.internal.pageSize.width = scaledViewport.width;
                        newPdf.internal.pageSize.height = scaledViewport.height;
                    }

                    newPdf.addImage(currentCanvas.toDataURL('image/png', 1.0), 'PNG', 0, 0, scaledViewport.width, scaledViewport.height, '', 'NONE');
                }

                newPdf.save(`${fileName}-up.pdf`);
            } catch (error) {
                alert('Erro ao realizar upscale do PDF: ' + error.message);
            }
        }
    </script>
</body>
</html>
