<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagem e PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #fileInput, #upscaleFileInput, #mergeFileInput {
            display: none;
        }
        select {
            margin: 10px;
            padding: 5px;
            font-size: 16px;
            border-radius: 4px;
        }
        #upscaleOptions, #mergeOptions {
            display: none;
            margin-top: 20px;
        }
        #upscaleFileButton, #mergeFileButton {
            margin-top: 10px;
        }
        .drag-area {
            border: 2px dashed #007bff;
            padding: 20px;
            margin: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .drag-area.dragover {
            background-color: #e0e0e0;
        }
        .drag-area p {
            margin: 0 0 10px 0;
            color: #333;
        }
        .file-list {
            margin-top: 10px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 4px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
        .remove-file {
            color: red;
            cursor: pointer;
            font-weight: bold;
        }
        .loading {
            display: none;
            margin: 15px 0;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor de Imagem e PDF</h1>
        <p>Escolha uma opção:</p>
        <button onclick="selectConversion('imageToPdf')">Converter Imagem para PDF</button>
        <button onclick="selectConversion('pdfToImage')">Converter PDF para Imagem</button>
        <button onclick="selectConversion('upscaleImage')">Aprimorar Imagem</button>
        <button onclick="selectConversion('upscalePdf')">Aprimorar PDF</button>
        <button onclick="selectConversion('mergeFiles')">Juntar Arquivos em PDF</button>

        <!-- Loading universal (agora aparece em todas as operações) -->
        <div class="loading" id="globalLoading">Carregando...</div>

        <input type="file" id="fileInput" onchange="handleFileUpload()">
        <input type="file" id="upscaleFileInput" onchange="handleUpscaleUpload()">
        <input type="file" id="mergeFileInput" multiple onchange="handleMergeFiles()" accept=".pdf,image/*">

        <div id="upscaleOptions">
            <label for="scaleFactor">Escolha o fator de upscale:</label>
            <select id="scaleFactor">
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="8">8x</option>
            </select>
            <div id="dragArea" class="drag-area">
                <p>Arraste e solte o arquivo aqui ou</p>
                <button id="upscaleFileButton" onclick="document.getElementById('upscaleFileInput').click()">
                    Selecionar ou arrastar arquivo
                </button>
            </div>
        </div>

        <div id="mergeOptions">
            <div id="mergeDragArea" class="drag-area">
                <p>Arraste e solte os arquivos aqui (PDFs e imagens) ou</p>
                <button id="mergeFileButton" onclick="document.getElementById('mergeFileInput').click()">
                    Selecionar arquivos
                </button>
            </div>
            <div id="fileList" class="file-list" style="display: none;"></div>
            <button id="mergeButton" style="display: none; margin-top: 10px;" onclick="mergeSelectedFiles()">
                Juntar e Baixar PDF
            </button>
        </div>
    </div>

    <script>
        let conversionType = null;
        let mergeFiles = [];

        function showLoading(show = true) {
            document.getElementById('globalLoading').style.display = show ? 'block' : 'none';
            document.querySelectorAll('button').forEach(b => b.disabled = show);
        }

        function selectConversion(type) {
            conversionType = type;
            document.getElementById('upscaleOptions').style.display = 'none';
            document.getElementById('mergeOptions').style.display = 'none';

            if (type === 'imageToPdf') {
                document.getElementById('fileInput').accept = 'image/*';
                document.getElementById('fileInput').click();
            } else if (type === 'pdfToImage') {
                document.getElementById('fileInput').accept = 'application/pdf';
                document.getElementById('fileInput').click();
            } else if (type === 'upscaleImage') {
                document.getElementById('upscaleOptions').style.display = 'block';
                document.getElementById('upscaleFileInput').accept = 'image/*';
            } else if (type === 'upscalePdf') {
                document.getElementById('upscaleOptions').style.display = 'block';
                document.getElementById('upscaleFileInput').accept = 'application/pdf';
            } else if (type === 'mergeFiles') {
                document.getElementById('mergeOptions').style.display = 'block';
                mergeFiles = [];
                updateFileList();
            }
        }

        // Drag-and-drop para upscale
        const dragArea = document.getElementById('dragArea');
        dragArea.addEventListener('dragover', e => { e.preventDefault(); dragArea.classList.add('dragover'); });
        dragArea.addEventListener('dragleave', () => dragArea.classList.remove('dragover'));
        dragArea.addEventListener('drop', e => {
            e.preventDefault();
            dragArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                const dt = new DataTransfer();
                dt.items.add(file);
                document.getElementById('upscaleFileInput').files = dt.files;
                handleUpscaleUpload();
            }
        });

        // Drag-and-drop para juntar
        const mergeDragArea = document.getElementById('mergeDragArea');
        mergeDragArea.addEventListener('dragover', e => { e.preventDefault(); mergeDragArea.classList.add('dragover'); });
        mergeDragArea.addEventListener('dragleave', () => mergeDragArea.classList.remove('dragover'));
        mergeDragArea.addEventListener('drop', e => {
            e.preventDefault();
            mergeDragArea.classList.remove('dragover');
            addMergeFiles(Array.from(e.dataTransfer.files));
        });

        function handleFileUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const name = file.name.split('.').slice(0, -1).join('.');

            showLoading(true);
            if (conversionType === 'imageToPdf') convertImageToPdf(file, name);
            else if (conversionType === 'pdfToImage') convertPdfToImage(file, name);
        }

        function handleUpscaleUpload() {
            const file = document.getElementById('upscaleFileInput').files[0];
            if (!file) return;
            const name = file.name.split('.').slice(0, -1).join('.');
            const factor = parseInt(document.getElementById('scaleFactor').value);
            showLoading(true);
            if (conversionType === 'upscaleImage') upscaleImage(file, name, factor);
            else if (conversionType === 'upscalePdf') upscalePdf(file, name, factor);
        }

        function handleMergeFiles() {
            addMergeFiles(Array.from(document.getElementById('mergeFileInput').files));
        }

        function addMergeFiles(files) {
            const valid = files.filter(f => ['application/pdf','image/png','image/jpeg','image/jpg','image/webp'].includes(f.type));
            mergeFiles = mergeFiles.concat(valid);
            updateFileList();
        }

        function updateFileList() {
            const list = document.getElementById('fileList');
            const btn = document.getElementById('mergeButton');
            if (mergeFiles.length === 0) {
                list.style.display = 'none';
                btn.style.display = 'none';
                return;
            }
            list.innerHTML = mergeFiles.map((f,i) => `
                <div class="file-item">
                    <span>${f.name}</span>
                    <span class="remove-file" onclick="mergeFiles.splice(${i},1);updateFileList()">×</span>
                </div>
            `).join('');
            list.style.display = 'block';
            btn.style.display = 'inline-block';
        }

        // ==================== JUNÇÃO PERFEITA: MESMA LARGURA, SEM FAIXA BRANCA, QUALIDADE MÁXIMA ====================
        async function mergeSelectedFiles() {
            if (mergeFiles.length === 0) return;
            showLoading(true);

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();
                let maxWidth = 0;
                const pages = [];

                // 1ª passada: coleta todas as páginas e calcula largura máxima
                for (const file of mergeFiles) {
                    if (file.type === 'application/pdf') {
                        const buf = await file.arrayBuffer();
                        const src = await PDFLib.PDFDocument.load(buf);
                        for (const page of src.getPages()) {
                            maxWidth = Math.max(maxWidth, page.getWidth());
                            pages.push({ type: 'pdf', page, src });
                        }
                    } else {
                        const buf = await file.arrayBuffer();
                        const img = file.type.includes('jpg') || file.type.includes('jpeg')
                            ? await pdfDoc.embedJpg(buf)
                            : await pdfDoc.embedPng(buf);
                        const { width } = img.scale(1);
                        maxWidth = Math.max(maxWidth, width);
                        pages.push({ type: 'image', img, width, height: img.scale(1).height });
                    }
                }

                // 2ª passada: cria páginas com largura unificada
                for (const item of pages) {
                    const origWidth = item.type === 'pdf' ? item.page.getWidth() : item.width;
                    const origHeight = item.type === 'pdf' ? item.page.getHeight() : item.height;
                    const scale = maxWidth / origWidth;
                    const newHeight = origHeight * scale;

                    const page = pdfDoc.addPage([maxWidth, newHeight]);

                    if (item.type === 'pdf') {
                        const emb = await pdfDoc.embedPage(item.page);
                        page.drawPage(emb, { x: 0, y: 0, xScale: scale, yScale: scale });
                    } else {
                        page.drawImage(item.img, { x: 0, y: 0, width: maxWidth, height: newHeight });
                    }
                }

                const bytes = await pdfDoc.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'arquivos_juntos.pdf';
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Erro ao juntar: ' + e.message);
            } finally {
                showLoading(false);
            }
        }

        // ==================== IMAGEM → PDF ====================
        function convertImageToPdf(file, name) {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const pdf = new jsPDF({
                        orientation: img.width > img.height ? 'l' : 'p',
                        unit: 'px',
                        format: [img.width, img.height]
                    });
                    pdf.addImage(e.target.result, 'PNG', 0, 0, img.width, img.height);
                    pdf.save(`${name}.pdf`);
                    showLoading(false);
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        }

        // ==================== PDF → IMAGENS (AGORA FUNCIONA) ====================
        async function convertPdfToImage(file, baseName) {
            try {
                const buf = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 4 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const link = document.createElement('a');
                    link.download = `${baseName}_pagina_${i}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
                showLoading(false);
            } catch (e) {
                alert('Erro ao converter PDF para imagens: ' + e.message);
                showLoading(false);
            }
        }

        // ==================== UPSCALE IMAGEM ====================
        function upscaleImage(file, name, factor) {
            const r = new FileReader();
            r.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const w = img.width * factor;
                    const h = img.height * factor;
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    if (factor === 8) {
                        ctx.drawImage(img, 0, 0, w/2, h/2);
                        ctx.drawImage(canvas, 0, 0, w/2, h/2, 0, 0, w, h);
                    } else {
                        ctx.drawImage(img, 0, 0, w, h);
                    }
                    canvas.toBlob(b => {
                        const url = URL.createObjectURL(b);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${name}_up.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showLoading(false);
                    }, 'image/png');
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        }

        // ==================== UPSCALE PDF (mantém texto selecionável) ====================
        async function upscalePdf(file, name, factor) {
            try {
                const buf = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(buf);
                const newPdf = await PDFLib.PDFDocument.create();

                for (const page of pdf.getPages()) {
                    const { width, height } = page.getSize();
                    const newPage = newPdf.addPage([width * factor, height * factor]);
                    const emb = await newPdf.embedPage(page);
                    newPage.drawPage(emb, { x: 0, y: 0, xScale: factor, yScale: factor });
                }

                const bytes = await newPdf.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${name}_up.pdf`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Erro ao aprimorar PDF: ' + e.message);
            } finally {
                showLoading(false);
            }
        }
    </script>
</body>
</html>
